
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoTrack - Citizen Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="dashboard-body">

    <!-- ==========================================
         NAVBAR
         ========================================== -->

    <header class="dashboard-nav">

        <div class="logo">
            ♻ EcoTrack
        </div>

        <div class="user-info">

            <span>
                Welcome, <strong class="user-name">Citizen</strong>
            </span>

            <div class="avatar">
                C
            </div>

            <button
                class="logout-btn"
                onclick="logout()">
                Logout
            </button>

        </div>

    </header>


    <!-- ==========================================
         DASHBOARD
         ========================================== -->

    <main class="dashboard">

        <!-- Header -->

        <div class="dashboard-header">

            <h1>Citizen Dashboard</h1>

            <p>
                Request waste pickup and track your collection status.
            </p>

        </div>


        <!-- ======================================
             STATISTICS
             ====================================== -->

        <div class="dashboard-cards">

            <div class="dashboard-card">

                <span>Total Requests</span>

                <strong id="totalRequests">
                    0
                </strong>

            </div>


            <div class="dashboard-card">

                <span>Pending</span>

                <strong id="pendingRequests">
                    0
                </strong>

            </div>


            <div class="dashboard-card">

                <span>Assigned</span>

                <strong id="assignedRequests">
                    0
                </strong>

            </div>


            <div class="dashboard-card">

                <span>Completed</span>

                <strong id="completedRequests">
                    0
                </strong>

            </div>

        </div>


        <!-- ======================================
             REQUEST WASTE PICKUP
             ====================================== -->

        <section class="panel">

            <h2>Request Waste Pickup</h2>

            <form
                id="wasteRequestForm"
                class="request-form">

                <!-- Waste Type -->

                <div class="form-group">

                    <label for="wasteType">
                        Waste Type
                    </label>

                    <select
                        id="wasteType"
                        required>

                        <option value="">
                            Select waste type
                        </option>

                        <option value="Plastic">
                            Plastic
                        </option>

                        <option value="Paper">
                            Paper
                        </option>

                        <option value="Organic">
                            Organic
                        </option>

                        <option value="Glass">
                            Glass
                        </option>

                        <option value="Metal">
                            Metal
                        </option>

                        <option value="Electronic">
                            Electronic Waste
                        </option>

                        <option value="Mixed">
                            Mixed Waste
                        </option>

                    </select>

                </div>


                <!-- Quantity -->

                <div class="form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <select
                        id="quantity"
                        required>

                        <option value="">
                            Select quantity
                        </option>

                        <option value="Small">
                            Small
                        </option>

                        <option value="Medium">
                            Medium
                        </option>

                        <option value="Large">
                            Large
                        </option>

                    </select>

                </div>


                <!-- Address -->

                <div class="form-group full">

                    <label for="address">
                        Pickup Address
                    </label>

                    <input
                        type="text"
                        id="address"
                        placeholder="Enter pickup location"
                        required>

                </div>


                <!-- Date -->

                <div class="form-group">

                    <label for="pickupDate">
                        Pickup Date
                    </label>

                    <input
                        type="date"
                        id="pickupDate"
                        required>

                </div>


                <!-- Time -->

                <div class="form-group">

                    <label for="pickupTime">
                        Preferred Time
                    </label>

                    <select
                        id="pickupTime"
                        required>

                        <option value="">
                            Select time
                        </option>

                        <option value="Morning">
                            Morning
                        </option>

                        <option value="Afternoon">
                            Afternoon
                        </option>

                        <option value="Evening">
                            Evening
                        </option>

                    </select>

                </div>


                <!-- Notes -->

                <div class="form-group full">

                    <label for="notes">
                        Additional Notes
                    </label>

                    <textarea
                        id="notes"
                        placeholder="Any additional information..."
                        rows="2">
                    </textarea>

                </div>


                <!-- Submit -->

                <div class="full">

                    <button
                        type="submit"
                        class="btn primary">

                        Submit Pickup Request

                    </button>

                </div>

            </form>

        </section>


        <!-- ======================================
             MY REQUESTS
             ====================================== -->

        <section class="panel">

            <h2>My Waste Requests</h2>

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Waste Type</th>

                            <th>Quantity</th>

                            <th>Address</th>

                            <th>Date</th>

                            <th>Status</th>

                        </tr>

                    </thead>


                    <tbody id="requestTableBody">

                        <tr>

                            <td
                                colspan="6"
                                style="text-align:center;">

                                No waste requests yet.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>

</body>

</html>
